name: CI/CD - Build, Test, Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE_NAME: static-site

jobs:
  lint-html:
    name: Lint & Validate HTML/CSS/JS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate HTML files exist and are non-empty
        run: |
          set -e
          for f in *.html; do
            if [ ! -s "$f" ]; then
              echo "ERROR: $f is empty or missing"
              exit 1
            fi
            echo "OK: $f"
          done

      - name: Check for broken relative asset references (basic)
        run: |
          set -e
          grep -oE 'src="[^"]+"|href="[^"]+"' *.html | \
          grep -vE 'http|https|mailto|tel|#' | \
          sed -E 's/.*"([^"]+)"/\1/' | sort -u | while read -r ref; do
            clean_ref="${ref#/}"
            if [ ! -e "$clean_ref" ] && [ -n "$clean_ref" ]; then
              echo "WARNING: referenced file not found locally: $ref"
            fi
          done

  build-and-scan:
    name: Build Docker Image & Security Scan
    runs-on: ubuntu-latest
    needs: lint-html
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container smoke test
        run: |
          docker run -d --name smoke-test -p 8080:8080 ${{ env.IMAGE_NAME }}:ci
          echo "Waiting for container to become healthy..."
          for i in $(seq 1 15); do
            status=$(docker inspect --format='{{.State.Health.Status}}' smoke-test || echo "starting")
            if [ "$status" = "healthy" ]; then
              echo "Container is healthy"
              break
            fi
            if [ "$i" = "15" ]; then
              echo "Container failed health check"
              docker logs smoke-test
              exit 1
            fi
            sleep 2
          done
          curl -f http://localhost:8080/healthz
          curl -f http://localhost:8080/
          docker stop smoke-test
          docker rm smoke-test

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"  # set to "1" to fail build on findings

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build-and-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "ERROR: RENDER_DEPLOY_HOOK_URL secret is not set"
            exit 1
          fi
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Deploy triggered successfully"