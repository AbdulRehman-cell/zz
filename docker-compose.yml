# -----------------------------------------------------------------------------
# Local development / self-hosted preview.
# No database or cache needed — this is a static site.
# -----------------------------------------------------------------------------
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: static-site:local
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production  # harmless placeholder; no node runtime present
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true