# Local development/testing only. Render deploys directly from the Dockerfile
# and does not use this file, but it's useful for `docker compose up` locally.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: static-site:local
    ports:
      - "8080:8080"
    environment:
      # No secrets needed for a static site; placeholder for future use.
      - SITE_ENV=${SITE_ENV:-production}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped