# -----------------------------------------------------------------------------
# Render Blueprint — Docker-based static site deployment
# Docs: https://render.com/docs/blueprint-spec
# -----------------------------------------------------------------------------
services:
  - type: web
    name: static-site
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: NGINX_PORT
        value: "8080"
    healthCheckPath: /healthz
    autoDeploy: true
    numInstances: 1
    # Render provides its own port binding; the container must listen on
    # the port defined by $PORT if using non-Docker runtimes. For Docker
    # runtime, Render auto-detects the EXPOSEd port (8080).