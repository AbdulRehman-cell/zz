# Render Blueprint — Infrastructure as Code
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: static-site
    env: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: SITE_ENV
        value: production
    numInstances: 1