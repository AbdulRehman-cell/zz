# Render Blueprint — deploys this static site as a Docker web service.
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: static-site
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: TZ
        value: UTC
    # Render sets $PORT automatically; nginx.conf listens on 8080,
    # so we tell Render which port the container exposes:
    numInstances: 1
    disk: {}